<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090a0c">
    <meta name="description" content="Play Need For Speed II Special Edition in your browser.">
    <meta name="application-name" content="NFS II SE">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="NFS II SE">
    <link vite-ignore rel="manifest" href="./manifest.webmanifest">
    <link vite-ignore rel="icon" type="image/png" sizes="32x32" href="./icons/nfs2se-32.png">
    <link vite-ignore rel="apple-touch-icon" sizes="192x192" href="./icons/nfs2se-192.png">
    <title>Need For Speed II SE</title>
    <script vite-ignore src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <main id="app">
      <canvas id="display" aria-hidden="true"></canvas>
      <canvas id="canvas" tabindex="-1" aria-label="Need For Speed II SE game canvas"></canvas>
      <button id="fullscreen" class="fullscreen-control secondary" type="button">Full screen</button>

      <section id="setup" class="setup" aria-labelledby="setup-title">
        <div class="setup-card">
          <h1 id="setup-title">Need For Speed II SE</h1>
          <p class="setup-copy">
            Choose a ZIP with the Special Edition <code>fedata</code> and <code>gamedata</code> folders.
          </p>

          <input id="archive-input" type="file" accept=".zip,application/zip" hidden>
          <label class="setup-setting" for="resolution">
            <span>Resolution</span>
            <select id="resolution">
              <option value="640x480" selected>640 × 480</option>
              <option value="800x600">800 × 600</option>
              <option value="1024x768">1024 × 768</option>
              <option value="1280x960">1280 × 960</option>
              <option value="1600x1200">1600 × 1200</option>
              <option value="1920x1440">1920 × 1440</option>
            </select>
          </label>
          <label class="setup-setting" for="scaling">
            <span>Scaling</span>
            <select id="scaling">
              <option value="nearest" selected>Nearest neighbor</option>
              <option value="interpolation">Interpolation</option>
            </select>
          </label>
          <div class="actions">
            <button id="choose-archive" class="secondary" type="button">Choose ZIP</button>
            <button id="replace-archive" class="secondary" type="button" hidden>Change ZIP</button>
            <button id="start-game" class="primary" type="button" disabled>Start game</button>
          </div>

          <p id="archive-detail" class="archive-detail"></p>
          <progress id="archive-progress" max="1" value="0" hidden></progress>
          <p id="setup-error" class="error" role="alert"></p>
        </div>
      </section>

      <div id="status" class="status" role="status">Loading WebAssembly…</div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
