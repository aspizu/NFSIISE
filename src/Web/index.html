<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090a0c">
    <title>Need For Speed II SE</title>
    <script vite-ignore src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <main id="app">
      <canvas id="display" aria-hidden="true"></canvas>
      <canvas id="canvas" tabindex="-1" aria-label="Need For Speed II SE game canvas"></canvas>
      <button id="fullscreen" class="fullscreen-control secondary" type="button">Full screen</button>

      <section id="setup" class="setup" aria-labelledby="setup-title">
        <div class="setup-card">
          <h1 id="setup-title">Need For Speed II SE</h1>
          <p class="setup-copy">
            Choose a ZIP with the Special Edition <code>fedata</code> and <code>gamedata</code> folders.
          </p>

          <input id="archive-input" type="file" accept=".zip,application/zip" hidden>
          <div class="actions">
            <button id="choose-archive" class="secondary" type="button">Choose ZIP</button>
            <button id="replace-archive" class="secondary" type="button" hidden>Change ZIP</button>
            <button id="start-game" class="primary" type="button" disabled>Start game</button>
          </div>

          <p id="archive-detail" class="archive-detail"></p>
          <progress id="archive-progress" max="1" value="0" hidden></progress>
          <p id="setup-error" class="error" role="alert"></p>
        </div>
      </section>

      <div id="status" class="status" role="status">Loading WebAssembly…</div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
